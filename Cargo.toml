[package]
name = "shaipot"
version = "3.0.0"
edition = "2021"
description = "Shaicoin RandomX miner"

[dependencies]
tokio = { version = "1.40.0", features = ["full"] }
# rustls with bundled roots, not native-tls: a released binary linking
# OpenSSL dies with "libssl.so.3: cannot open shared object file" on any
# machine whose OpenSSL differs from the build hosts. Bundled roots also
# mean no dependency on a system trust store.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls 0.23 refuses to pick a crypto provider implicitly and panics at
# startup ("Could not automatically determine the process-level
# CryptoProvider"). Pin ring and install it explicitly in main.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3.30"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
rand = "0.8.5"
colored = "2.1.0"
hex = "0.4.3"
primitive-types = "0.13.1"
num_cpus = "1.16.0"
clap = { version = "4.5.18", features = ["derive"] }
sha2 = "0.10.8"
warp = "0.3.7"

[build-dependencies]
cmake = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
