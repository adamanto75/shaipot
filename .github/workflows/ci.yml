name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The known-answer test is the point of this job. Shaicoin's RandomX uses
      # a custom Argon2 salt and rebalanced instruction frequencies; a build that
      # loses them runs at full speed and produces hashes the chain has never
      # seen, with no error anywhere. This catches that.
      - name: Test
        run: cargo test --release --verbose

      - name: Build
        run: cargo build --release
